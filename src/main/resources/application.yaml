server:
  port: 8080

spring:
  application:
    name: polizas-api
  datasource:
    url: jdbc:h2:mem:polizasdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    api-key: 123456
  core:
    mock-url: http://localhost:8080/core-mock/evento
  negocio:
    ipc: 0.05

logging:
  level:
    com.segurosbolivar.polizas: DEBUG